name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install check-jsonschema jsonschema

      - name: Python syntax check (tools)
        run: |
          python -m py_compile tools/forge_eval.py tools/forge_report.py
          echo "Python syntax OK"

      - name: Smoke test forge_report.py
        run: |
          python tools/forge_report.py --help > /dev/null
          echo "forge_report.py runnable"

      - name: Validate JSON schema files (meta-schema)
        run: |
          check-jsonschema --check-metaschema telemetry/schema.json
          if [ -f learnings/schema.json ]; then
            check-jsonschema --check-metaschema learnings/schema.json
          fi
          echo "Schema files conform to JSON Schema meta-schema"

      - name: Validate JSONL data files (per-line)
        run: |
          python <<'PY'
          import json, os, sys, jsonschema

          targets = [
              ("telemetry/sessions.jsonl", "telemetry/schema.json"),
              ("learnings/_index.jsonl",   "learnings/schema.json"),
          ]
          ok = True
          for data_path, schema_path in targets:
              if not os.path.exists(data_path):
                  print(f"skip: {data_path} not present (gitignored data file)")
                  continue
              if not os.path.exists(schema_path):
                  print(f"warn: {schema_path} missing — cannot validate {data_path}")
                  continue
              with open(schema_path) as f:
                  schema = json.load(f)
              count = 0
              with open(data_path) as f:
                  for i, line in enumerate(f, 1):
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          jsonschema.validate(json.loads(line), schema)
                          count += 1
                      except Exception as e:
                          print(f"FAIL {data_path}:{i}: {e}")
                          ok = False
              print(f"OK: {data_path} ({count} records)")
          sys.exit(0 if ok else 1)
          PY

      - name: Markdown lint
        uses: articulate/actions-markdownlint@v1
        with:
          files: 'README.md QUICK_START.md docs/**/*.md'
          config: '.markdownlint.json'

      - name: Done
        run: echo "All CI checks passed"
