name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install check-jsonschema

      - name: Python syntax check (smoke test tools)
        run: |
          python -m py_compile tools/forge_eval.py tools/forge_report.py
          echo "✅ Python syntax OK"

      - name: Smoke test forge_report.py
        run: |
          python tools/forge_report.py --help
          echo "✅ forge_report.py runnable"

      - name: Validate telemetry schema
        run: |
          check-jsonschema --schemafile telemetry/schema.json telemetry/sessions.jsonl || echo "⚠️  No sessions.jsonl yet or validation skipped (expected in early stage)"

      - name: Validate learnings schema
        run: |
          if [ -f learnings/schema.json ]; then
            check-jsonschema --schemafile learnings/schema.json learnings/_index.jsonl || echo "⚠️  learnings validation skipped"
          else
            echo "No learnings/schema.json found (optional)"
          fi

      - name: Markdown lint (basic)
        uses: articulate/actions-markdownlint@v1
        with:
          files: 'README.md QUICK_START.md docs/**/*.md'

      - name: Success
        run: echo "✅ All CI checks passed"
